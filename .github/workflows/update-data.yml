name: Update data

on:
  schedule:
    - cron: "30 22 * * *"   # daily after US close (CN closes 07:00 UTC, crypto trades daily)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install requirements
        run: pip install -r pipeline/requirements.txt
      - name: Update prices
        run: |
          set -o pipefail
          python pipeline/update_prices.py --root docs 2>&1 | tee update.log
          {
            echo '## Data update'
            echo '```'
            cat update.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate
        run: python pipeline/validate.py --root docs
      - name: Commit and push
        run: |
          rm -f update.log
          if [ -n "$(git status --porcelain docs)" ]; then
            through=$(python -c "import json;print(json.load(open('docs/data_manifest.json'))['dataThrough'])")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Data through ${through}"
            git push
          else
            echo "No data changes."
          fi
